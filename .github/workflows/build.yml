name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run server game tests
        run: ./gradlew build runGameTest -PwithoutLootr

      - name: Upload Super Gacha JARs
        uses: actions/upload-artifact@v4
        with:
          name: super-gacha-minecraft-26.3
          path: build/libs/super-gacha-*.jar
          if-no-files-found: error
